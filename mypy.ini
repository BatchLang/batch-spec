[mypy]
python_version = 3.11
files = scripts, conformance, tests
strict = true
exclude = (?x)(
    ^generated/
    )

# Disallow any types (disallow_any_generics is also implied by strict)
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_explicit = true
disallow_any_decorated = true

# Additional strict options (also implied by strict; kept explicit)
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true

# Import and module handling
no_implicit_reexport = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

# Error handling (extra_checks covers the old strict_concatenate flag)
strict_equality = true
extra_checks = true

show_column_numbers = true
show_error_context = true
pretty = true

# Skip pytest submodules so mypy does not load numpy stubs. Those stubs use
# PEP 695 `type` aliases that error when python_version = 3.11.
[mypy-pytest.*]
follow_imports = skip

# jsonschema has no bundled stubs.
[mypy-jsonschema]
ignore_missing_imports = true

[mypy-antlr4.*]
ignore_missing_imports = true

[mypy-BatchLexer.*]
ignore_missing_imports = true

[mypy-BatchParser.*]
ignore_missing_imports = true

# These directories are not packages. mypy names each file by its stem
# (verify, run_parser, test_tooling), so the overrides cannot use scripts.* .

# Test-specific overrides - relaxed rules for test files
[mypy-conftest,test_conformance,test_tooling,test_verify]
disallow_any_decorated = false
disallow_any_expr = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_unimported = false
disallow_any_explicit = false
warn_return_any = false
strict_equality = false
disable_error_code = union-attr,arg-type,misc,no-any-unimported

# Maintenance scripts. YAML, JSON, and argparse values are untyped at the boundary.
[mypy-_paths,validate,verify,generate_parser,release_notes,run_parser]
disallow_any_expr = false
warn_return_any = false
