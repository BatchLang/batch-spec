name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # generate --check needs java. ubuntu-latest provides a JDK.
      - name: Run quality checks
        run: python scripts/verify.py --skip-pytest

  test:
    name: pytest and conformance (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 30 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: python -m pytest

      - name: Run parser conformance
        run: python conformance/run_parser.py --impl antlr

  antlr-lint-windows:
    name: antlr-lint (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-suffix: ${{ github.job }}
          activate-environment: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # Python before 3.15 cannot encode antlr-lint's success mark unless
      # Python is forced onto UTF-8. This is the case the Ubuntu job misses.
      - name: Lint the grammar
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: antlr-lint lint --no-colors --severity error --disable-rule S003 --disable-rule N002 grammar

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - test
      - antlr-lint-windows
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read VERSION
        id: version
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
      - name: Check tag matches VERSION
        run: |
          expected="${{ steps.version.outputs.tag }}"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "Tag $actual does not match VERSION file ($expected)" >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
